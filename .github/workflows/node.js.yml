name: ParadoxJS CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paradoxjs:
    uses: rincorpes/rincorpes-workflows/.github/workflows/npm-package-ci.yml@main
    with:
      project_name: paradoxjs
      working_directory: .
      node_versions: '["18.x", "20.x", "21.x", "22.x", "23.x", "24.x"]'
      operating_systems: '["ubuntu-latest"]'
      install_command: npm ci
      build_command: npm run build
      test_command: npm run test:ci
      extra_commands: |
        cd examples/paradox-app
        npm ci
        npm run check
        npm run build
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      DISCORD_WEBHOOK_URL_CI: ${{ secrets.DISCORD_WEBHOOK_URL_CI }}
